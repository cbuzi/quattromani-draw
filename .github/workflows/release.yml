name: Release

# Pushing a tag like v0.1.0 builds the packages for every platform and publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test the Core
        run: dotnet test tests/Quattromani.Core.Tests -c Release
      - name: Package
        shell: bash
        run: bash scripts/package.sh "${{ matrix.rid }}" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: dist/Quattromani-Draw-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Quattromani Draw ${GITHUB_REF_NAME#v}" --generate-notes
