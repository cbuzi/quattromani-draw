name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Quattromani.sln -c Release
      - name: Test the Core
        run: dotnet test tests/Quattromani.Core.Tests -c Release --no-build
